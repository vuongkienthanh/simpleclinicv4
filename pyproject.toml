[project]
name = "simpleclinic"
version = "4.0.0"
description = "Phần mềm phòng khám Simple Clinic"
readme = "README.md"
authors = [{ name = "vuongkienthanh", email = "thanhstardust@outlook.com" }]
urls = { repository = "https://github.com/vuongkienthanh/SimpleClinic" }
requires-python = ">=3.14"
dependencies = [
    "wxpython>=4.2.5 ; sys_platform == 'win32'",
    "wxpython @ https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04/wxpython-4.2.5-cp314-cp314-linux_x86_64.whl ; sys_platform == 'linux'",
]


[dependency-groups]
dev = ["pyinstaller>=6.14.2"]

[tool.ruff.lint]
ignore = ["E501"]
unfixable = ["F401"]
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]

[tool.basedpyright]
reportAny = false
reportImportCycles = false
reportExplicitAny = false
reportUnusedCallResult = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportMissingTypeStubs = false
reportUnannotatedClassAttribute = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportUnknownLambdaType = false

[project.scripts]
init_db = "init_db:main"
backup_db = "backup_db:main"

[project.gui-scripts]
simpleclinic = "simpleclinic:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
