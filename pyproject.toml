[project]
name = "simpleclinic"
version = "4.0.0"
description = "Phần mềm phòng khám Simple Clinic"
readme = "README.md"
authors = [{ name = "vuongkienthanh", email = "thanhstardust@outlook.com" }]
urls = { repository = "https://github.com/vuongkienthanh/SimpleClinic" }
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "python-docx >= 1.2.0",
    "python-docx-replace>=0.4.4",
    "wxpython>=4.2.5",
]


[dependency-groups]
dev = ["pyinstaller>=6.14.2"]

[tool.ruff.lint]
ignore = ["E501"]
unfixable = ["F401"]
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]

[tool.basedpyright]
reportAny = false
reportImportCycles = false
reportExplicitAny = false
reportUnusedCallResult = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportMissingTypeStubs = false
reportUnannotatedClassAttribute = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportUnknownLambdaType = false
reportUninitializedInstanceVariable = false

[project.scripts]
init = "init:main"
backup = "backup:main"
s1a = "s1a:main"

[project.gui-scripts]
simpleclinic = "simpleclinic:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
